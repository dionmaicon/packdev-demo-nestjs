name: packdev compat check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  compat:
    # TEMPORARY: dionmaicon added for a manual bugfix-verification PR.
    # Revert to just 'dependabot[bot]' after.
    if: github.actor == 'dependabot[bot]' || github.actor == 'dionmaicon'
    runs-on: ubuntu-latest
    steps:
      - uses: dionmaicon/packdev-agents@main
        with:
          # TEMPORARY (bugfix verification B): test-script instead of
          # test-command — proves packdev's own harness-caveat detection
          # can now see the app's real script body via --test-script,
          # instead of being hidden behind the "npm test" indirection.
          # Revert to test-command: "npm test" after (see the PR that
          # changed this).
          test-script: "test"
          # TEMPORARY, same reason as the if: above.
          allowed-actors: "dependabot[bot],renovate[bot],dionmaicon"
          # No package-json-path — two independently-tracked Nest apps
          # (apps/gateway, apps/notifier) each get their own Dependabot PR
          # touching a different file; auto-discovery finds whichever one
          # actually changed.
